# ============================================================================
# commitlint.yml — Validate conventional commit format on all PRs
# ============================================================================
# Runs on every PR targeting main.
# Checks ALL commits in the PR — not just the latest one.
# Must pass before merging (enforced via branch protection rules).
#
# HOW TO USE:
#   Place this file at: .github/workflows/commitlint.yml in your app repo
# ============================================================================

name: Lint Commits

on:
  pull_request:
    branches: [main]

jobs:
  commitlint:
    name: Validate commit messages
    runs-on: arc-runner-set        # ← your ARC self-hosted runner on K8s
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0           # full history needed to read all PR commits

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install commitlint
        run: |
          npm install --save-dev \
            @commitlint/cli \
            @commitlint/config-conventional

      - name: Validate commit messages
        run: |
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose
